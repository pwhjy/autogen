# ENV.yaml
#
# Values here are passed into each agbench task environment. They can reference
# host environment variables. Empty values are safe: config.yaml provides
# defaults for the local cliproxyapi endpoint.

VACTHBENCH_MODEL: ${VACTHBENCH_MODEL}
VACTHBENCH_OPENAI_BASE_URL: ${VACTHBENCH_OPENAI_BASE_URL}
VACTHBENCH_OPENAI_API_KEY: ${VACTHBENCH_OPENAI_API_KEY}
OPENAI_API_KEY: ${OPENAI_API_KEY}
